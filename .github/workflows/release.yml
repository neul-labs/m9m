name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: '1.24'

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Release Binaries
    needs: get-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: m9m-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: m9m-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: m9m-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: m9m-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: m9m-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          COMMIT="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          go build -trimpath -ldflags="-w -s -X main.Version=${{ needs.get-version.outputs.version }} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" -o ${{ matrix.artifact_name }} ./cmd/m9m
        shell: bash

      - name: Generate checksum
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  release:
    name: Create Release
    needs: [get-version, build-release]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        id: create_release
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          TAG="${{ github.ref_name }}"

          cat > release_notes.md << 'EOF'
          ## Changes in this release
          ${{ steps.changelog.outputs.changelog || 'See the full commit history for changes in this release.' }}

          ## Installation

          ### Docker
          ```bash
          docker pull neul-labs/m9m:${{ needs.get-version.outputs.version }}
          ```

          ### Binary
          Download the binary for your platform below.

          ### From Source
          ```bash
          git clone https://github.com/neul-labs/m9m.git
          cd m9m
          git checkout v${{ needs.get-version.outputs.version }}
          make build
          ```

          ## Checksums
          See the `.sha256` files attached to this release.
          EOF

          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file release_notes.md \
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Build and Push Docker Release
    needs: get-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            neul-labs/m9m
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.get-version.outputs.version }}

  npm-publish:
    name: Publish to npm
    needs: get-version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version and publish
        working-directory: bindings/nodejs
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-publish:
    name: Publish to PyPI
    needs: get-version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build hatchling

      - name: Sync version and build
        working-directory: bindings/python
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  homebrew:
    name: Update Homebrew Formula
    needs: [get-version, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout homebrew-tap repository
        uses: actions/checkout@v4
        with:
          repository: neul-labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          BASE_URL="https://github.com/neul-labs/m9m/releases/download/v${VERSION}"

          # Update version
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/m9m.rb

          # Update URLs and SHA256s for all platforms
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            # Download SHA256 checksum file
            curl -sSL "${BASE_URL}/m9m-${platform}.sha256" -o "${platform}.sha256"
            SHA256=$(cut -d' ' -f1 "${platform}.sha256")

            # Update URL
            sed -i "s|https://github.com/neul-labs/m9m/releases/download/v[^/\\\"]*/m9m-${platform}|https://github.com/neul-labs/m9m/releases/download/v${VERSION}/m9m-${platform}|g" Formula/m9m.rb

            # Update SHA256 (line immediately following the URL for this platform)
            sed -i "/m9m-${platform}\"\)/!b;n;s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/m9m.rb
          done

          rm -f *.sha256

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/m9m.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
            exit 0
          fi
          git commit -m "Update m9m to v${{ needs.get-version.outputs.version }}"
          git push
