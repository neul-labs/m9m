site_name: m9m Documentation
site_url: https://docs.neullabs.com/m9m/
site_description: m9m is a drop-in n8n alternative in Go — 5–10× faster, 70% lower memory, deterministic execution, zero npm dependencies. Run n8n workflows unchanged.
site_author: Neul Labs
repo_url: https://github.com/neul-labs/m9m
repo_name: neul-labs/m9m
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - meta
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neul-labs/m9m
      name: m9m on GitHub
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/m9m-cli
      name: m9m-cli on npm
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/m9m-cli/
      name: m9m-cli on PyPI
    - icon: fontawesome/brands/docker
      link: https://github.com/neul-labs/m9m/pkgs/container/m9m
      name: m9m on GHCR
  generator: false
  tagline: The n8n alternative without the bugs — faster, more reliable workflow automation.
  og_image: https://docs.neullabs.com/m9m/assets/og.png
  twitter_handle: ""

copyright: Copyright &copy; 2024 Neul Labs · m9m is open source under the MIT license.

