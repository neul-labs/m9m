[project]
name = "m9m-cli"
version = "1.0.0"
description = "Drop-in n8n alternative in Go — faster, more reliable, no Node.js required. Run n8n workflows unchanged."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Neul Labs", email = "contact@neullabs.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Go",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
keywords = [
    "workflow",
    "workflow-automation",
    "automation",
    "n8n",
    "n8n-alternative",
    "n8n-replacement",
    "low-code",
    "ipaas",
    "integration-platform",
    "mcp",
    "mcp-server",
    "ai-agents",
    "claude-code",
    "webhook",
    "cron",
    "scheduler",
    "workflow-engine",
    "m9m",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/neul-labs/m9m"
Documentation = "https://docs.neullabs.com/m9m"
Repository = "https://github.com/neul-labs/m9m"
Issues = "https://github.com/neul-labs/m9m/issues"
Changelog = "https://github.com/neul-labs/m9m/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["m9m*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
